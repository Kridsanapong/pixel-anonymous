<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pixel Anonymous - Agent Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- หน้าสร้าง/เข้าห้อง -->
    <div id="lobby" class="screen active">
      <div class="pixel-container">
        <h1 class="pixel-title">🎮 PIXEL ANONYMOUS</h1>
        <p class="pixel-subtitle">Agent Chat • Private • Pixel Art</p>
        
        <div class="pixel-box">
          <button id="createRoomBtn" class="pixel-btn">
             สร้างออฟฟิศใหม่
          </button>
          
          <div class="pixel-divider">หรือ</div>
          
          <input 
            type="text" 
            id="chatIdInput" 
            placeholder="ใส่รหัสห้อง"
            maxlength="8"
            class="pixel-input"
          >
          <button id="joinRoomBtn" class="pixel-btn">
             เข้าห้อง
          </button>
        </div>

        <div class="pixel-info">
          <p>⚡ ไม่ระบุตัวตน</p>
          <p>🔒 ห้องอยู่ 24 ชม.</p>
          <p>🎨 Pixel Agent Characters</p>
        </div>
      </div>
    </div>

    <!-- หน้าแชทแบบ Agent -->
    <div id="chatRoom" class="screen">
      <div class="chat-header">
        <div class="room-info">
          <span class="room-id"> ห้อง: <span id="roomIdDisplay"></span></span>
          <span class="user-count">👥 <span id="userCount">1</span> Agents</span>
        </div>
        <div class="chat-actions">
          <button id="keepMessagesBtn" class="pixel-btn-small">💾 เก็บแชท</button>
          <button id="leaveRoomBtn" class="pixel-btn-small">🚪 ออก</button>
        </div>
      </div>

      <!-- พื้นที่ตัวละคร Pixel Agents -->
      <div id="agentArea" class="agent-area">
        <div id="agentsContainer"></div>
      </div>

      <!-- พื้นที่ข้อความ -->
      <div id="messagesContainer" class="messages-container">
        <!-- ข้อความจะแสดงที่นี่ -->
      </div>

      <div class="chat-input-area">
        <input 
          type="text" 
          id="messageInput" 
          placeholder="พิมพ์ข้อความให้ Agent ส่ง..."
          class="pixel-input"
        >
        <button id="sendBtn" class="pixel-btn-icon">📤</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
